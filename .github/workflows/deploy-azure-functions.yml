name: Deploy to Azure Functions

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'DeploymentAPI/**'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AZURE_FUNCTIONAPP_NAME: 'func-deployment-status-api'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './DeploymentAPI'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Setup .NET ${{ env.DOTNET_VERSION }}'
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 'Restore dependencies'
      run: dotnet restore
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

    - name: 'Build project'
      run: dotnet build --configuration Release --no-restore
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

    - name: 'Run tests'
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      continue-on-error: true

    - name: 'Publish project'
      run: dotnet publish --configuration Release --output ./publish
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

    - name: 'Deploy to Azure Functions'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/publish
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    - name: 'Health Check'
      run: |
        echo "Waiting 30 seconds for deployment to complete..."
        sleep 30
        curl -f https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/clients/status || echo "Health check failed, but deployment completed"

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: 'Deployment Status'
      run: |
        if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
          echo "✅ Deployment successful to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}"
          echo "🔗 Function App: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net"
        else
          echo "❌ Deployment failed"
          exit 1
        fi
