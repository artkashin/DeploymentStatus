name: Provision production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate infrastructure
        run: az deployment group validate --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --template-file infra/main.bicep --parameters entraTenantId="${{ secrets.AZURE_TENANT_ID }}" entraApiClientId="${{ vars.ENTRA_API_CLIENT_ID }}"
      - name: Provision infrastructure
        id: deploy
        run: |
          az deployment group create --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --template-file infra/main.bicep --parameters entraTenantId="${{ secrets.AZURE_TENANT_ID }}" entraApiClientId="${{ vars.ENTRA_API_CLIENT_ID }}" --query properties.outputs --output json > outputs.json
          echo "### Production infrastructure outputs" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
