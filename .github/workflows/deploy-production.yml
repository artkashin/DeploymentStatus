name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  api:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet publish DeploymentAPI/DeploymentAPI.csproj --configuration Release --output publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: publish
          sku: flexconsumption
      - name: Verify deployed Functions
        shell: bash
        run: |
          for attempt in {1..12}; do
            state="$(az resource show --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' --resource-type Microsoft.Web/sites --name '${{ vars.AZURE_FUNCTIONAPP_NAME }}' --api-version 2024-04-01 --query properties.state --output tsv)"
            if [ "$state" = 'Running' ] && az functionapp function list --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' --name '${{ vars.AZURE_FUNCTIONAPP_NAME }}' --query '[].name' --output tsv | grep -qx '${{ vars.AZURE_FUNCTIONAPP_NAME }}/RegisterDeploymentEvent'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Function App did not become ready with RegisterDeploymentEvent registered.' >&2
          exit 1

  dashboard:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ vars.DEPLOYMENT_STATUS_API_URL }}/api
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ''
          output_location: dist
          app_build_command: npm run build
